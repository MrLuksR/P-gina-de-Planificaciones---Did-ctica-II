    <style>
        .custom-scrollbar::-webkit-scrollbar {

        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .document-card {
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .filter-btn {
            flex-shrink: 0;
        }

        #docModal {
            transition: opacity 0.2s ease;
        }

</head>

<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col antialiased">

    <!-- ENCABEZADO -->

            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">

                <div class="flex items-center space-x-3">
                    <div class="p-2.5 bg-brand-700/60 rounded-xl border border-brand-500/30 backdrop-blur-md shadow-inner">

                    </div>

                    <div>
                        <h1 class="text-2xl font-bold tracking-tight text-white">
                            Clases Prácticas
                        </h1>
                        <p class="text-xs text-brand-200/80 font-medium">
                            Repositorio de Planificaciones, Guías y Evaluaciones
                        </p>
                    </div>
                </div>

                <!-- BUSCADOR -->
                <div class="relative min-w-[280px] sm:min-w-[360px]">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-brand-300">
                        <i data-lucide="search" class="w-4 h-4"></i>
                    </div>

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Buscar por título, fecha o palabras clave..."
                        aria-label="Buscar documentos"
                        class="w-full pl-10 pr-4 py-2.5 bg-brand-950/40 border border-brand-700/50 rounded-xl text-sm text-white placeholder-brand-300/70 focus:outline-none focus:ring-2 focus:ring-brand-400 focus:bg-brand-950/70 transition-all duration-200"
                    >
                </div>
            </div>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

        <!-- BARRA DE CONTROLES -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8 bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">

            <!-- FILTROS POR CATEGORÍA -->
            <div
                class="flex items-center space-x-1.5 overflow-x-auto pb-2 sm:pb-0 custom-scrollbar"
                id="categoryFilters"
            >
                <button
                    type="button"
                    data-category="all"
                    aria-pressed="true"
                    class="filter-btn active px-4 py-2 rounded-lg text-xs font-semibold transition-all duration-200 whitespace-nowrap bg-brand-600 text-white shadow-sm shadow-brand-500/20"
                >
                    Todos (<span id="count-all">0</span>)
                </button>

                <button
                    type="button"
                    data-category="Planificaciones"
                    aria-pressed="false"
                    class="filter-btn px-4 py-2 rounded-lg text-xs font-semibold text-blue-700 bg-blue-50 hover:bg-blue-100 transition-all duration-200 whitespace-nowrap"
                >
                    Planificaciones (<span id="count-planificaciones">0</span>)
                </button>

                <button
                    type="button"
                    data-category="Guías Secuenciales"
                    aria-pressed="false"
                    class="filter-btn px-4 py-2 rounded-lg text-xs font-semibold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 transition-all duration-200 whitespace-nowrap"
                >
                    Guías (<span id="count-guias">0</span>)
                </button>

                <button
                    type="button"
                    data-category="Unidades Didácticas"
                    aria-pressed="false"
                    class="filter-btn px-4 py-2 rounded-lg text-xs font-semibold text-violet-700 bg-violet-50 hover:bg-violet-100 transition-all duration-200 whitespace-nowrap"
                >
                    Unidades (<span id="count-unidades">0</span>)
                </button>

                <button
                    type="button"
                    data-category="Autoevaluaciones"
                    aria-pressed="false"
                    class="filter-btn px-4 py-2 rounded-lg text-xs font-semibold text-amber-700 bg-amber-50 hover:bg-amber-100 transition-all duration-200 whitespace-nowrap"
                >
                    Autoevaluaciones (<span id="count-autoevaluaciones">0</span>)
                </button>

                <button
                    type="button"
                    data-category="Evaluación"
                    aria-pressed="false"
                    class="filter-btn px-4 py-2 rounded-lg text-xs font-semibold text-rose-700 bg-rose-50 hover:bg-rose-100 transition-all duration-200 whitespace-nowrap"

                    Evaluaciones (<span id="count-evaluaciones">0</span>)

        </div>

    </main>

    <!-- MODAL DE PREVISUALIZACIÓN -->

        id="docModal"
        class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
    >

            <div class="px-4 sm:px-6 py-4 bg-brand-900 text-white flex items-center justify-between gap-3">

                    <h3 id="modalTitle" class="font-semibold text-base truncate">
                        Título del documento
                    </h3>
                </div>

                <div class="flex items-center space-x-2 flex-shrink-0">
                    <a
                        id="modalExternalLink"
                        href="#"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="px-3 py-1.5 bg-brand-700 hover:bg-brand-600 text-white text-xs font-medium rounded-lg transition-colors flex items-center space-x-1"
                    >
                        <span>Abrir en Drive</span>
                        <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                    </a>

                    <button
                        type="button"
                        id="closeModalBtn"
                        aria-label="Cerrar vista previa"
                        class="p-1.5 hover:bg-brand-800 rounded-lg text-brand-200 hover:text-white transition-colors"
                    >
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <!-- CONTENIDO DEL MODAL -->
            <div class="flex-grow bg-slate-100 relative">

                    class="w-full h-full border-0"
                    src=""
                    title="Vista previa del documento"
                    referrerpolicy="no-referrer"
                    allowfullscreen
                ></iframe>
            </div>
        </div>
    </div>

        // =====================================================
        // COLORES POR CATEGORÍA
        // =====================================================

        function getCategoryStyle(category) {
            switch (category) {
                case 'Planificaciones':
                    return {
                        bg: 'bg-blue-50',
                        text: 'text-blue-700',
                        border: 'border-blue-200',
                        badge: 'bg-blue-100 text-blue-800 border-blue-200',
                        icon: 'file-spreadsheet'
                    };

                case 'Guías Secuenciales':
                    return {
                        bg: 'bg-emerald-50',
                        text: 'text-emerald-700',
                        border: 'border-emerald-200',
                        badge: 'bg-emerald-100 text-emerald-800 border-emerald-200',
                        icon: 'list-checks'
                    };

                case 'Unidades Didácticas':
                    return {
                        bg: 'bg-violet-50',
                        text: 'text-violet-700',
                        border: 'border-violet-200',
                        badge: 'bg-violet-100 text-violet-800 border-violet-200',
                        icon: 'book-open'
                    };

                case 'Autoevaluaciones':
                    return {
                        bg: 'bg-amber-50',
                        text: 'text-amber-700',
                        border: 'border-amber-200',
                        badge: 'bg-amber-100 text-amber-800 border-amber-200',
                        icon: 'user-check'
                    };

                case 'Evaluación':
                    return {
                        bg: 'bg-rose-50',
                        text: 'text-rose-700',
                        border: 'border-rose-200',
                        badge: 'bg-rose-100 text-rose-800 border-rose-200',
                        icon: 'clipboard-check'
                    };

                default:
                    return {
                        bg: 'bg-slate-50',
                        text: 'text-slate-700',
                        border: 'border-slate-200',
                        badge: 'bg-slate-100 text-slate-700 border-slate-200',
                        icon: 'file-text'
                    };
            }
        }

        // =====================================================
        // INICIALIZACIÓN
        // =====================================================

        document.addEventListener('DOMContentLoaded', () => {
            updateCounts();
            renderCards();
            lucide.createIcons();

            // Buscador
            searchInput.addEventListener('input', (event) => {
                searchQuery = event.target.value
                    .toLocaleLowerCase('es')
                    .trim();

                renderCards();
            });

            // Filtros por categoría
            categoryFilters.addEventListener('click', (event) => {
                const button = event.target.closest('.filter-btn');

                if (!button) return;

                currentCategory = button.dataset.category;

                updateActiveFilter(button);
                renderCards();
            });

            // Vista de cuadrícula
            gridViewBtn.addEventListener('click', () => {
                if (isGridView) return;

                isGridView = true;

                gridViewBtn.className =
                    'p-2 rounded-lg bg-brand-50 text-brand-700 hover:bg-brand-100 transition-colors';

                listViewBtn.className =
                    'p-2 rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-700 transition-colors';

                gridViewBtn.setAttribute('aria-pressed', 'true');
                listViewBtn.setAttribute('aria-pressed', 'false');

                cardsContainer.className =
                    'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6';

                renderCards();
            });

            // Vista de lista
            listViewBtn.addEventListener('click', () => {
                if (!isGridView) return;

                isGridView = false;

                listViewBtn.className =
                    'p-2 rounded-lg bg-brand-50 text-brand-700 hover:bg-brand-100 transition-colors';

                gridViewBtn.className =
                    'p-2 rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-700 transition-colors';

                listViewBtn.setAttribute('aria-pressed', 'true');
                gridViewBtn.setAttribute('aria-pressed', 'false');

                cardsContainer.className = 'flex flex-col gap-3';

                renderCards();
            });

            // Cerrar modal
            closeModalBtn.addEventListener('click', closeModal);

            // Cerrar al hacer clic fuera del contenido
            docModal.addEventListener('click', (event) => {
                if (event.target === docModal) {
                    closeModal();
                }
            });

            // Cerrar con Escape
            document.addEventListener('keydown', (event) => {
                if (
                    event.key === 'Escape' &&
                    !docModal.classList.contains('hidden')
                ) {
                    closeModal();
                }
            });
        });

        // =====================================================
        // ACTUALIZAR FILTRO ACTIVO
        // =====================================================

        function updateActiveFilter(activeButton) {
            document.querySelectorAll('.filter-btn').forEach((button) => {
                button.classList.remove(
                    'bg-brand-600',
                    'text-white',
                    'shadow-sm',
                    'shadow-brand-500/20',
                    'active'
                );

                button.classList.add(
                    'text-slate-600',
                    'hover:bg-slate-100',
                    'hover:text-slate-900'
                );

                button.setAttribute('aria-pressed', 'false');
            });

            activeButton.classList.remove(
                'text-slate-600',
                'hover:bg-slate-100',
                'hover:text-slate-900'
            );

            activeButton.classList.add(
                'bg-brand-600',
                'text-white',
                'shadow-sm',
                'shadow-brand-500/20',
                'active'
            );

            activeButton.setAttribute('aria-pressed', 'true');
        }

        // =====================================================
        // CONTADORES DE DOCUMENTOS
        // =====================================================

        function updateCounts() {
            const countByCategory = (category) =>
                documentsData.filter(
                    document => document.category === category
                ).length;

            document.getElementById('count-all').textContent =
                documentsData.length;

            document.getElementById('count-planificaciones').textContent =
                countByCategory('Planificaciones');

            document.getElementById('count-guias').textContent =
                countByCategory('Guías Secuenciales');

            document.getElementById('count-unidades').textContent =
                countByCategory('Unidades Didácticas');

            document.getElementById('count-autoevaluaciones').textContent =
                countByCategory('Autoevaluaciones');

            document.getElementById('count-evaluaciones').textContent =
                countByCategory('Evaluación');
        }

        // =====================================================
        // FILTRAR DOCUMENTOS
        // =====================================================

        function getFilteredDocuments() {
            return documentsData.filter((document) => {
                const matchesCategory =
                    currentCategory === 'all' ||
                    document.category === currentCategory;

                const searchableText = [
                    document.title,
                    document.description,
                    document.badge,
                    document.category,
                    document.date
                ].join(' ').toLocaleLowerCase('es');

                const matchesSearch =
                    searchableText.includes(searchQuery);

                return matchesCategory && matchesSearch;
            });
        }

        // =====================================================
        // RENDERIZAR DOCUMENTOS
        // =====================================================

        function renderCards() {
            const filteredDocs = getFilteredDocuments();

            cardsContainer.innerHTML = '';

            if (filteredDocs.length === 0) {
                emptyState.classList.remove('hidden');
                lucide.createIcons();
                return;
            }

            emptyState.classList.add('hidden');

            filteredDocs.forEach((doc) => {
                const style = getCategoryStyle(doc.category);

                const card = isGridView
                    ? createGridCard(doc, style)
                    : createListCard(doc, style);

                cardsContainer.appendChild(card);
            });

            lucide.createIcons();
        }

        // =====================================================
        // CREAR TARJETA: VISTA CUADRÍCULA
        // =====================================================

        function createGridCard(doc, style) {
            const card = document.createElement('article');

            card.className =
                'document-card bg-white rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition-all duration-300 flex flex-col justify-between overflow-hidden group hover:-translate-y-0.5';

            card.innerHTML = `
                <div class="p-5">
                    <div class="flex items-center justify-between gap-2 mb-3 flex-wrap">

                        <span class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-semibold ${style.bg} ${style.text} ${style.border} border">
                            <i data-lucide="${style.icon}" class="w-3.5 h-3.5 mr-1.5"></i>
                            ${escapeHTML(doc.category)}
                        </span>

                        <span class="text-[11px] font-medium text-slate-400 flex items-center">
                            <i data-lucide="calendar" class="w-3 h-3 mr-1"></i>
                            ${escapeHTML(doc.date)}
                        </span>
                    </div>

                    <h3 class="text-base font-bold text-slate-900 group-hover:text-brand-600 transition-colors leading-snug mb-2">
                        ${escapeHTML(doc.title)}
                    </h3>

                    <p class="text-xs text-slate-500 leading-relaxed">
                        ${escapeHTML(doc.description)}
                    </p>
                </div>

                <div class="px-5 py-3.5 bg-slate-50/80 border-t border-slate-100 flex items-center justify-between gap-2 flex-wrap">

                    <span class="inline-flex items-center text-[11px] font-semibold px-2 py-1 rounded-md border ${style.badge}">
                        ${escapeHTML(doc.badge)}
                    </span>

                    <div class="flex items-center space-x-2">

                        <button
                            type="button"
                            data-action="preview"
                            data-id="${doc.id}"
                            class="px-3 py-1.5 bg-white hover:bg-brand-50 border border-slate-200 hover:border-brand-200 text-brand-700 rounded-lg text-xs font-semibold transition-all flex items-center space-x-1"
                        >
                            <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                            <span>Vista previa</span>
                        </button>

                        <a
                            href="${escapeHTML(doc.url)}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="p-1.5 bg-brand-600 hover:bg-brand-700 text-white rounded-lg transition-colors"
                            title="Abrir en Drive"
                            aria-label="Abrir ${escapeHTML(doc.title)} en Drive"
                        >
                            <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                        </a>
                    </div>
                </div>
            `;

            return card;
        }

        // =====================================================
        // CREAR TARJETA: VISTA LISTA
        // =====================================================

        function createListCard(doc, style) {
            const card = document.createElement('article');

            card.className =
                'document-card bg-white rounded-xl border border-slate-200/80 p-4 shadow-sm hover:shadow-md transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-4';

            card.innerHTML = `
                <div class="flex items-start space-x-3.5 min-w-0">

                    <div class="p-2.5 rounded-lg ${style.bg} ${style.text} flex-shrink-0 mt-0.5">
                        <i data-lucide="${style.icon}" class="w-5 h-5"></i>
                    </div>

                    <div class="min-w-0">
                        <div class="flex items-center flex-wrap gap-2 mb-1">

                            <span class="text-xs font-semibold ${style.text}">
                                ${escapeHTML(doc.category)}
                            </span>

                            <span class="text-slate-300">•</span>

                            <span class="text-xs text-slate-400">
                                ${escapeHTML(doc.date)}
                            </span>
                        </div>

                        <h3 class="text-sm font-bold text-slate-900 leading-snug">
                            ${escapeHTML(doc.title)}
                        </h3>

                        <p class="text-xs text-slate-500 mt-1">
                            ${escapeHTML(doc.description)}
                        </p>

                        <div class="mt-2">
                            <span class="inline-flex items-center text-[11px] font-semibold px-2 py-1 rounded-md border ${style.badge}">
                                ${escapeHTML(doc.badge)}
                            </span>
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-end space-x-2 flex-shrink-0 pt-2 sm:pt-0 border-t sm:border-t-0 border-slate-100">

                    <button
                        type="button"
                        data-action="preview"
                        data-id="${doc.id}"
                        class="px-3 py-1.5 bg-slate-100 hover:bg-brand-50 hover:text-brand-700 text-slate-700 rounded-lg text-xs font-semibold transition-colors flex items-center space-x-1"
                    >
                        <i data-lucide="eye" class="w-3.5 h-3.5"></i>
                        <span>Vista previa</span>
                    </button>

                    <a
                        href="${escapeHTML(doc.url)}"
                        target="_blank"
                        rel="noopener noreferrer"
                        class="px-3 py-1.5 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-xs font-semibold transition-colors flex items-center space-x-1"
                    >
                        <span>Abrir</span>
                        <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
                    </a>
                </div>
            `;

            return card;
        }

        // =====================================================
        // ESCAPAR TEXTO DINÁMICO
        // =====================================================

        function escapeHTML(value) {
            return String(value).replace(/[&<>"']/g, (character) => {
                const entities = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                };

                return entities[character];
            });
        }

        // =====================================================
        // ABRIR VISTA PREVIA
        // =====================================================

        function openModal(title, url) {
            previouslyFocusedElement = document.activeElement;

            modalTitle.textContent = title;
            modalExternalLink.href = url;

            let embedUrl = url;

            // Obtener el ID de archivos de Google Drive.
            const driveMatch = url.match(
                /drive\.google\.com\/(?:file\/d\/|open\?id=)([^/?&]+)/
            );

            const docsMatch = url.match(
                /docs\.google\.com\/document\/d\/([^/?&]+)/
            );

            const formsMatch = url.match(
                /docs\.google\.com\/forms\/d\/([^/?&]+)/
            );

            if (driveMatch) {
                embedUrl =
                    `https://drive.google.com/file/d/${driveMatch[1]}/preview`;
            } else if (docsMatch) {
                embedUrl =
                    `https://docs.google.com/document/d/${docsMatch[1]}/preview`;
            } else if (formsMatch) {
                embedUrl =
                    `https://docs.google.com/forms/d/${formsMatch[1]}/viewform?embedded=true`;
            }

            modalIframe.src = embedUrl;

            docModal.classList.remove('hidden');
            docModal.classList.add('flex');

            document.body.classList.add('overflow-hidden');

            closeModalBtn.focus();
        }

        // =====================================================
        // CERRAR VISTA PREVIA
        // =====================================================

        function closeModal() {
            docModal.classList.add('hidden');
            docModal.classList.remove('flex');

            modalIframe.src = '';

            document.body.classList.remove('overflow-hidden');

            if (
                previouslyFocusedElement &&
                typeof previouslyFocusedElement.focus === 'function'
            ) {
                previouslyFocusedElement.focus();
            }
        }

        // =====================================================
        // EVENTOS DE LOS BOTONES DE VISTA PREVIA
        // =====================================================

        cardsContainer.addEventListener('click', (event) => {
            const previewButton = event.target.closest(
                '[data-action="preview"]'
            );

            if (!previewButton) return;

            const documentId = Number(previewButton.dataset.id);

            const selectedDocument = documentsData.find(
                document => document.id === documentId
            );

            if (!selectedDocument) return;

            openModal(
                selectedDocument.title,
                selectedDocument.url
            );
        });
    </script>
</body>
</html>
